<div class="main">
    <div class="card">
        <h2>Plytelių skaičiuoklė</h2>

        <label>Plotas (m²):</label>
        <input id="ply_plotas" type="number" value="10">

        <label>Plytelės ilgis (cm):</label>
        <input id="ply_ilgis" type="number" value="30">

        <label>Plytelės plotis (cm):</label>
        <input id="ply_plotis" type="number" value="60">

        <label>Atsarga (%):</label>
        <input id="ply_atsarga" type="number" value="10">

        <button onclick="skaiciuotiPlyteles()">Skaičiuoti</button>
        <div id="ply_rez" class="result"></div>
