<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laminato skaičiuoklė – Meistrų Skaičiuoklės</title>

<style>
body { margin:0; font-family:Arial; background:#f4f4f4; color:#222; }
header { background:#222; padding:15px 20px; display:flex; align-items:center; gap:20px; color:white; box-shadow:0 3px 10px rgba(0,0,0,0.3); }
nav a { color:white; margin-right:20px; text-decoration:none; font-size:18px; transition:0.3s; }
nav a:hover { color:#ff7b00; transform:translateY(-2px); }
.container { max-width:900px; margin:auto; padding:20px; }
.card { background:white; padding:25px; margin-bottom:25px; border-radius:12px; box-shadow:0 3px 10px rgba(0,0,0,0.1); transition:0.3s; }
.card:hover { transform:translateY(-6px); box-shadow:0 6px 18px rgba(0,0,0,0.2); }
input { width:100%; padding:12px; margin-top:10px; border-radius:6px; border:1px solid #ccc; font-size:16px; }
.button { display:inline-block; padding:12px 18px; background:#ff7b00; color:white; text-decoration:none; border-radius:6px; margin-top:10px; transition:0.3s; }
.button:hover { background:#e56f00; transform:scale(1.05); }
.store-list a { display:block; padding:12px; background:#fff; margin:10px 0; border-radius:8px; text-decoration:none; color:#222; box-shadow:0 2px 6px rgba(0,0,0,0.1); transition:0.3s; }
.store-list a:hover { background:#ff7b00; color:white; transform:translateY(-3px); }
footer { text-align:center; padding:20px; color:#777; }
</style>

<script>
function skaiciuoti() {
    let plotas = parseFloat(document.getElementById("plotas").value);
    let pakuote = 2.4; // 1 pakuotė dengia 2.4m²
    if (!plotas) { alert("Įvesk grindų plotą!"); return; }
    let kiekis = plotas / pakuote;
    document.getElementById("rezultatas").innerText = "Reikia laminato pakuočių: " + Math.ceil(kiekis);
}
</script>
</head>

<body>

<header>
    <svg width="180" height="40"><rect x="0" y="10" width="60" height="60" rx="8" fill="#ff7b00"/><path d="M20 25 L40 25 L50 45 L10 45 Z" fill="white"/><text x="80" y="55" font-size="32" fill="#fff">Laminatas</text></svg>
    <nav>
        <a href="/">Pagrindinis</a>
        <a href="/meistru-skaiciuoklė/">Skaičiuoklės</a>
    </nav>
</header>

<div class="container">

    <div class="card">
        <h2>Laminato skaičiuoklė</h2>
        <label>Grindų plotas (m²)</label>
        <input id="plotas" type="number" step="0.01">
        <a class="button" onclick="skaiciuoti()">Skaičiuoti</a>
        <h3 id="rezultatas" style="margin-top:20px;"></h3>
    </div>

    <div class="card">
        <h2>Kur pirkti laminatą?</h2>
        <p>Statybinių medžiagų parduotuvės:</p>

        <div class="store-list">
            <a href="https://www.senukai.lt" target="_blank">Senukai</a>
            <a href="https://www.ermitazas.lt" target="_blank">Ermitazas</a>
            <a href="https://www.mokivezi.lt" target="_blank">Moki-Veži</a>
            <a href="https://www.parketas.lt" target="_blank">Parketas.lt</a>
            <a href="https://www.tinklas.lt" target="_blank">Tinklas.lt</a>
        </div>
    </div>

</div>

<footer>© 2026 Meistrų Skaičiuoklės – Petras</footer>
</body>
</html>
