<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laminato skaičiuoklė</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Laminato skaičiuoklė</h1>

    <div class="calc-box">
        <label>Kambario plotas (m²):</label>
        <input type="number" id="plotas">

        <label>Pakuotės plotas (m²):</label>
        <input type="number" id="pakPlotas">

        <label>Pakuotės kaina (€):</label>
        <input type="number" id="pakKaina">

        <button onclick="skaiciuoti()">Skaičiuoti</button>

        <p id="rezultatas"></p>
    </div>

    <script>
        function skaiciuoti() {
            let plotas = Number(document.getElementById("plotas").value);
            let pakPlotas = Number(document.getElementById("pakPlotas").value);
            let pakKaina = Number(document.getElementById("pakKaina").value);

            let reikalinga = Math.ceil(plotas / pakPlotas);
            let suma = reikalinga * pakKaina;

            document.getElementById("rezultatas").innerText =
                "Reikės pakuočių: " + reikalinga +
                " | Bendra kaina: " + suma.toFixed(2) + " €";
        }
    </script>

</body>
</html>
