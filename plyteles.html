<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plytelių skaičiuoklė</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Plytelių skaičiuoklė</h1>

    <div class="calc-box">
        <label>Plotas (m²):</label>
        <input type="number" id="plotas">

        <label>Plytelių kaina už m² (€):</label>
        <input type="number" id="kaina">

        <button onclick="skaiciuoti()">Skaičiuoti</button>

        <p id="rezultatas"></p>
    </div>

    <script>
        function skaiciuoti() {
            let plotas = Number(document.getElementById("plotas").value);
            let kaina = Number(document.getElementById("kaina").value);
            let suma = plotas * kaina;

            document.getElementById("rezultatas").innerText =
                "Bendra kaina: " + suma.toFixed(2) + " €";
        }
    </script>

</body>
</html>
