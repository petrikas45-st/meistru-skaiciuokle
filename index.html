<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meistrų skaičiuoklės</title>

    <!-- Ikonos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Stilius -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        .header {
            background: #ff7f00;
            padding: 20px;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .menu a {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-size: 18px;
            display: flex;
            align-items: center;
            transition: 0.2s;
        }

        .menu a:hover {
            background: #ffe0c2;
        }

        .menu a i {
            margin-right: 10px;
            font-size: 22px;
            color: #ff7f00;
        }
    </style>
</head>

    <div class="header">Meistrų skaičiuoklės</div>
